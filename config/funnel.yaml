# Funnel configuration for the CRO analysis tool.
# Everything the analysis needs to know about the funnel lives here — nothing is hardcoded.
# Entries marked "TODO: bevestigen" are assumptions that still need confirmation.

funnel:
  # Counting unit: users (confirmed 2026-09-24).
  counting_unit: users
  # Open funnel: a user may enter at any step (confirmed 2026-09-24).
  # Consequence: step N > step N-1 is possible and is reported as a warning, not an error.
  funnel_type: open

  # Ordered GA4 e-commerce steps.
  steps:
    - id: page_view
      label: Landingspagina bekeken
      ga4_event: page_view
      # Only page_views on the product line's landing page count (see product_lines.*.landing_page_regex).
      # Confirmed 2026-09-24.
      landing_page_only: true
    - id: view_item
      label: Product bekeken
      ga4_event: view_item
    - id: add_to_cart
      label: Premie berekend
      ga4_event: add_to_cart
    - id: begin_checkout
      label: Aanvraag gestart
      ga4_event: begin_checkout
    - id: add_payment_info
      label: Betaalgegevens ingevuld
      ga4_event: add_payment_info
    - id: purchase
      label: Afgesloten
      ga4_event: purchase

  # Micro-conversion = premieberekening = add_to_cart (confirmed 2026-09-24).
  micro_conversion: add_to_cart
  # Macro-conversion = purchase.
  macro_conversion: purchase

product_lines:
  - id: auto
    label: Autoverzekering
    landing_page_regex: "^/verzekeringen/autoverzekering/?$"  # confirmed 2026-09-25
    enabled: true
  - id: woon
    label: Woonverzekering
    landing_page_regex: "^/verzekeringen/woonverzekering/?$"  # TODO: bevestigen bij activeren
    enabled: false
  - id: reis
    label: Reisverzekering
    landing_page_regex: "^/verzekeringen/reisverzekering/?$"  # TODO: bevestigen bij activeren
    enabled: false
  - id: fiets
    label: Fietsverzekering
    landing_page_regex: "^/verzekeringen/fietsverzekering/?$"  # TODO: bevestigen bij activeren
    enabled: false
  - id: bromfiets
    label: Bromfietsverzekering
    landing_page_regex: "^/verzekeringen/bromfietsverzekering/?$"  # TODO: bevestigen bij activeren
    enabled: false

segments:
  device:
    - id: mobile
      label: Mobiel
    - id: desktop
      label: Desktop
    - id: tablet
      label: Tablet
  # GA4 default channel grouping (confirmed 2026-09-24). ga4_name is the value in GA4/BigQuery exports.
  channel:
    - id: sea
      label: SEA (betaald zoeken)
      ga4_name: Paid Search
    - id: seo
      label: SEO (organisch zoeken)
      ga4_name: Organic Search
    - id: direct
      label: Direct
      ga4_name: Direct
    - id: email
      label: E-mail
      ga4_name: Email
    - id: paid_social
      label: Paid social
      ga4_name: Paid Social
    - id: organic_social
      label: Organische social
      ga4_name: Organic Social
    - id: affiliate
      label: Affiliate / vergelijker
      ga4_name: Affiliates
    - id: referral
      label: Verwijzing
      ga4_name: Referral
    - id: display
      label: Display
      ga4_name: Display
    - id: cross_network
      label: Cross-network
      ga4_name: Cross-network
    - id: paid_shopping
      label: Paid shopping
      ga4_name: Paid Shopping
    - id: organic_shopping
      label: Organische shopping
      ga4_name: Organic Shopping
    - id: paid_video
      label: Paid video
      ga4_name: Paid Video
    - id: organic_video
      label: Organische video
      ga4_name: Organic Video
    - id: paid_other
      label: Overig betaald
      ga4_name: Paid Other
    - id: audio
      label: Audio
      ga4_name: Audio
    - id: sms
      label: SMS
      ga4_name: SMS
    - id: mobile_push
      label: Pushberichten
      ga4_name: Mobile Push Notifications
    - id: unassigned
      label: Niet toegewezen
      ga4_name: Unassigned
  # Period granularity (confirmed 2026-09-24: per date).
  period: date

thresholds:
  # All thresholds confirmed 2026-09-25.
  # Warn when a segment has fewer conversions than this at the macro-conversion step.
  min_conversions: 100
  # Significance level for segment comparisons.
  alpha: 0.05
  # Defaults for the power calculation in the measurement plan (phase 5).
  power: 0.8
  default_mde_relative: 0.05
